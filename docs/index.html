```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>LLM Playground</h1>
      <p>Ask a question and get an AI-generated response.</p>
    </header>

    <section class="panel">
      <div id="chatHistory" aria-live="polite">
        <div class="message assistant">
          <strong>AI Assistant</strong>
          <p>Hello! Enter your question below to get started.</p>
        </div>
      </div>

      <form id="chatForm">
        <label for="userInput">Your question</label>

        <textarea
          id="userInput"
          placeholder="Ask me anything..."
          rows="3"
          required
        ></textarea>

        <button id="runButton" type="submit">Send</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <footer>
      Powered by GitHub Pages and your AI API
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
```
